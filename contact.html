<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARKLINE Contact</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

header {
  position: sticky;
  top: 0;
  background: #111;
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
}

nav a {
  color: white;
  margin-left: 20px;
  text-decoration: none;
}

section {
  padding: 40px;
  text-align: center;
}

form {
  max-width: 400px;
  margin: auto;
}

input, textarea {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border: none;
}

button {
  padding: 10px;
  background: #00bcd4;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<header>
  <h2>DARKLINE</h2>
  <nav>
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="team.html">Team</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section>
  <h1>Contact Us</h1>

  <form onsubmit="handleSubmit(event)">
    <input type="text" placeholder="Your Name" required>
    <input type="email" placeholder="Your Email" required>
    <textarea placeholder="Message"></textarea>
    <button type="submit">Send</button>
  </form>

</section>

<script>
function handleSubmit(e) {
  e.preventDefault();
  alert("Message sent 🚀");
}
</script>

</body>
</html>
